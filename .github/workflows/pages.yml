name: Build and deploy browser game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Emscripten 4.0.10
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
          python .tools/emsdk/emsdk.py install 4.0.10
          python .tools/emsdk/emsdk.py activate 4.0.10

      - name: Test controls and native game rules
        run: |
          if ! pkg-config --exists sdl2; then
            sudo apt-get update
            sudo apt-get install -y libsdl2-dev
          fi
          node tests/browser-controls.mjs
          node tests/rainbow-renderer.mjs
          node tests/rainbow-assets.mjs
          node tests/rainbow-audio.mjs
          node tests/leaderboard.mjs
          python scripts/test_trainer.py
          python scripts/test_scene.py

      - name: Build game and corresponding source archive
        run: python scripts/build.py

      - name: Validate browser scripts and release files
        run: |
          node --check dist/app.js
          node --check dist/runner.js
          node --check dist/rainbow-renderer.js
          node --check dist/rainbow-assets.js
          node --check dist/rainbow-audio.js
          node --check dist/leaderboard.js
          python scripts/verify_release.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
