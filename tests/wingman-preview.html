<!doctype html><html lang="en"><meta charset="utf-8"><base href="../dist/"><title>Aircraft livery comparison</title><style>body{margin:0;background:#4e86b1;color:#fff2ce;font:24px Georgia;display:flex;align-items:center;justify-content:center;min-height:100vh;gap:50px}figure{margin:0;text-align:center}canvas{display:block;width:360px;height:360px;image-rendering:auto}figcaption{padding:10px}</style><script src="rainbow-assets.js"></script><script>
addEventListener('load',async()=>{
 await RainbowAssets.ready;

 }
});
</script></html>
